services:
  scoreboard:
    # Available tags: latest, v1.2.3, linux-arm64, linux-arm-v7, linux-amd64
    # For Raspberry Pi 4/5: use linux-arm64 or latest
    # For Raspberry Pi 3/Zero 2: use linux-arm-v7
    # See README.md for complete tag documentation
    image: ghcr.io/stayupthetree/mlb_scoreboard:latest
    container_name: mlb-scoreboard
    privileged: true
    devices:
      - /dev/gpiomem:/dev/gpiomem
    volumes:
      - ./config:/app/configs
    environment:
      - WATCHER_ENABLED=true
      # Set to true to enable emulation mode (no LED hardware required)
      - EMULATED=false
      # LED matrix configuration parameters
      - PARAM_LED_GPIO_MAPPING=adafruit-hat-pwm
      - PARAM_LED_BRIGHTNESS=20
      - PARAM_LED_SLOWDOWN_GPIO=4
      - PARAM_LED_COLS=64
      - PARAM_LED_ROWS=32
      - TZ=America/New_York
    # Uncomment to enable a web server for emulator mode
    # ports:
    #   - "8888:8888"
    restart: unless-stopped
