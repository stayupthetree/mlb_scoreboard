name: Docker Build and Push

on:
  workflow_dispatch:  # Manual trigger for Docker build
  push:
    branches:
      - main        # Auto versioning on main branch pushes
    tags:
      - 'v*.*.*'    # Build on version tags
  pull_request:
    branches:
      - main        # Build on PRs for testing

permissions:
  contents: write   # For creating tags and releases
  packages: write   # For pushing to GHCR
  id-token: write   # For cosign signing

jobs:
  # Version bumping job (only on main branch pushes)
  version-bump:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tag_version.outputs.new_version }}
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          fetch_all_tags: true
      
      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

  # Docker build job
  build-docker-images:
    runs-on: ubuntu-latest
    needs: [version-bump]
    if: ${{ always() && (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      
      - name: Log into GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.1.1
        with:
          cosign-release: 'v2.1.1'
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Default tags for all builds
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=,suffix=,format=short
            type=semver,pattern={{version}},value=${{ needs.version-bump.outputs.new_version }},enable=${{ needs.version-bump.result == 'success' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version-bump.outputs.new_version }},enable=${{ needs.version-bump.result == 'success' }}
            type=semver,pattern={{major}},value=${{ needs.version-bump.outputs.new_version }},enable=${{ needs.version-bump.result == 'success' }}
            # Platform-specific tags (normalize platform names)
            type=raw,value=linux-amd64,enable=${{ matrix.platform == 'linux/amd64' }}
            type=raw,value=linux-arm64,enable=${{ matrix.platform == 'linux/arm64' }}
            type=raw,value=linux-arm-v7,enable=${{ matrix.platform == 'linux/arm/v7' }}
            type=raw,value=linux-amd64-latest,enable=${{ matrix.platform == 'linux/amd64' && is_default_branch }}
            type=raw,value=linux-arm64-latest,enable=${{ matrix.platform == 'linux/arm64' && is_default_branch }}
            type=raw,value=linux-arm-v7-latest,enable=${{ matrix.platform == 'linux/arm/v7' && is_default_branch }}
            type=raw,value=linux-amd64-{{sha}},enable=${{ matrix.platform == 'linux/amd64' }}
            type=raw,value=linux-arm64-{{sha}},enable=${{ matrix.platform == 'linux/arm64' }}
            type=raw,value=linux-arm-v7-{{sha}},enable=${{ matrix.platform == 'linux/arm/v7' }}
            # Versioned platform tags
            type=semver,pattern={{version}},value=${{ needs.version-bump.outputs.new_version }},prefix=linux-amd64-,enable=${{ matrix.platform == 'linux/amd64' && needs.version-bump.result == 'success' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version-bump.outputs.new_version }},prefix=linux-amd64-,enable=${{ matrix.platform == 'linux/amd64' && needs.version-bump.result == 'success' }}
            type=semver,pattern={{major}},value=${{ needs.version-bump.outputs.new_version }},prefix=linux-amd64-,enable=${{ matrix.platform == 'linux/amd64' && needs.version-bump.result == 'success' }}
            type=semver,pattern={{version}},value=${{ needs.version-bump.outputs.new_version }},prefix=linux-arm64-,enable=${{ matrix.platform == 'linux/arm64' && needs.version-bump.result == 'success' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version-bump.outputs.new_version }},prefix=linux-arm64-,enable=${{ matrix.platform == 'linux/arm64' && needs.version-bump.result == 'success' }}
            type=semver,pattern={{major}},value=${{ needs.version-bump.outputs.new_version }},prefix=linux-arm64-,enable=${{ matrix.platform == 'linux/arm64' && needs.version-bump.result == 'success' }}
            type=semver,pattern={{version}},value=${{ needs.version-bump.outputs.new_version }},prefix=linux-arm-v7-,enable=${{ matrix.platform == 'linux/arm/v7' && needs.version-bump.result == 'success' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version-bump.outputs.new_version }},prefix=linux-arm-v7-,enable=${{ matrix.platform == 'linux/arm/v7' && needs.version-bump.result == 'success' }}
            type=semver,pattern={{major}},value=${{ needs.version-bump.outputs.new_version }},prefix=linux-arm-v7-,enable=${{ matrix.platform == 'linux/arm/v7' && needs.version-bump.result == 'success' }}
          flavor: |
            latest=false
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign each platform-specific tag (skip multi-arch tags like 'latest')
          for tag in $TAGS; do
            if [[ "$tag" =~ linux-(amd64|arm64|arm-v7) ]]; then
              cosign sign --yes ${REGISTRY}/${IMAGE_NAME}:${tag}
            fi
          done

  # Create manifest for multi-arch tags
  create-manifest:
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.1.1
        with:
          cosign-release: 'v2.1.1'
      
      - name: Create and push multi-arch manifest for latest
        run: |
          docker buildx imagetools create \
            --tag ${REGISTRY}/${IMAGE_NAME}:latest \
            ${REGISTRY}/${IMAGE_NAME}:linux-amd64 \
            ${REGISTRY}/${IMAGE_NAME}:linux-arm64 \
            ${REGISTRY}/${IMAGE_NAME}:linux-arm-v7
      
      - name: Create and push multi-arch manifest for versioned tags
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          docker buildx imagetools create \
            --tag ${REGISTRY}/${IMAGE_NAME}:${VERSION} \
            ${REGISTRY}/${IMAGE_NAME}:linux-amd64-${VERSION} \
            ${REGISTRY}/${IMAGE_NAME}:linux-arm64-${VERSION} \
            ${REGISTRY}/${IMAGE_NAME}:linux-arm-v7-${VERSION}
      
      - name: Sign multi-arch manifests
        run: |
          # Sign the latest manifest
          cosign sign --yes ${REGISTRY}/${IMAGE_NAME}:latest
          
          # Sign versioned manifests if this is a tagged release
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            cosign sign --yes ${REGISTRY}/${IMAGE_NAME}:${VERSION}
          fi
